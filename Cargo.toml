[package]
name = "tlx"
version = "2.0.0"
edition = "2024"

[[bin]]
name = "tlx"
path = "src/main.rs"

[dependencies]
chrono = "0.4.45"
eframe = "0.36.2"
egui_extras = "0.36.2"
image = { version = "0.25", default-features = false, features = ["png"] }
memchr = "2.8.3"
regex = "1.13.1"
rfd = "0.17.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
