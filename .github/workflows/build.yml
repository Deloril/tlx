name: build

# Builds native tlx binaries on each OS's own runner — Fyne is a cgo/OpenGL app,
# so every target compiles on matching hardware rather than cross-compiling.
# Every push/PR builds and tests; pushing a v* tag also publishes a release.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # the release job attaches binaries

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: tlx-x86_64.AppImage
          - os: macos-latest
            asset: tlx-macos-universal.zip
          - os: windows-latest
            asset: tlx-windows-amd64.exe
    runs-on: ${{ matrix.os }}
    env:
      # matrix.asset is a fixed string defined above, but route it through an
      # env var so run: steps never interpolate an expression directly.
      ASSET: ${{ matrix.asset }}
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          cache: true

      - name: Install Linux GUI headers
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols libffi-dev libgtk-3-dev

      # Engine is pure Go; test it everywhere without a display.
      - name: Test engine
        run: go test ./internal/model/...

      # Package Linux as an AppImage: a single double-clickable file that carries
      # the icon and .desktop entry, so the file manager shows the icon and
      # launches it without an install step. The raw binary lives at usr/bin/tlx
      # inside; extract with --appimage-extract if you want it on its own.
      - name: Build (Linux AppImage)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          APPDIR=tlx.AppDir
          mkdir -p "$APPDIR/usr/bin" \
                   "$APPDIR/usr/share/applications" \
                   "$APPDIR/usr/share/icons/hicolor/1024x1024/apps"
          go build -ldflags "-s -w" -o "$APPDIR/usr/bin/tlx" ./cmd/tlx
          cp packaging/linux/AppRun    "$APPDIR/AppRun"
          # Desktop file id must equal the app's Fyne UniqueID so the Wayland
          # app_id and the X11 WM_CLASS (set at runtime) both resolve to it.
          cp packaging/linux/nz.timeline.explorer.desktop "$APPDIR/nz.timeline.explorer.desktop"
          cp packaging/linux/nz.timeline.explorer.desktop "$APPDIR/usr/share/applications/nz.timeline.explorer.desktop"
          cp internal/gui/icon.png     "$APPDIR/tlx.png"
          cp internal/gui/icon.png     "$APPDIR/usr/share/icons/hicolor/1024x1024/apps/tlx.png"
          chmod +x "$APPDIR/AppRun" "$APPDIR/usr/bin/tlx"
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          # --appimage-extract-and-run avoids needing FUSE on the runner.
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "$APPDIR" "$ASSET"

      # Build a universal binary, then wrap it in a .app bundle so double-clicking
      # opens a windowed app instead of a Terminal session. The bundle is zipped
      # so the executable bit and directory structure survive download.
      - name: Build (macOS universal .app)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          GOARCH=arm64 go build -ldflags "-s -w" -o tlx-arm64 ./cmd/tlx
          GOARCH=amd64 go build -ldflags "-s -w" -o tlx-amd64 ./cmd/tlx
          lipo -create -output tlx tlx-arm64 tlx-amd64
          rm -f tlx-arm64 tlx-amd64
          file tlx

          APP="tlx.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp packaging/darwin/Info.plist "$APP/Contents/Info.plist"
          cp packaging/darwin/tlx.icns "$APP/Contents/Resources/tlx.icns"
          cp tlx "$APP/Contents/MacOS/tlx"
          chmod +x "$APP/Contents/MacOS/tlx"
          rm -f tlx
          # Zip preserving the bundle (ditto keeps macOS metadata + exec bits).
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ASSET"

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          # Embed the .ico into the exe so Explorer and the taskbar show it.
          go run github.com/akavel/rsrc@latest \
            -ico packaging/windows/tlx.ico -arch amd64 -o cmd/tlx/rsrc_windows.syso
          go build -ldflags "-s -w -H windowsgui" -o "$ASSET" ./cmd/tlx

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
